{% extends "registration/_auth_base.html" %}
{% load i18n %}

{% block subtitle %}{% trans "Reset password" %}{% endblock %}
{% block heading %}{% trans "Reset password" %}{% endblock %}
{% block form %}
<form method="post" action="{% url 'password_reset' %}">

    {{ form.as_p }}
    <button type="submit">{% trans "Send reset email" %}</button>
</form>
{% endblock %}
