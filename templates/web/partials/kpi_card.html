{% load static %}
<article class="wb-kpi-card tone-{{ kpi.tone }}">
  <div class="wb-kpi-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      {% if kpi.icon == "building" %}<path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1M10 21v-4h4v4"/>
      {% elif kpi.icon == "users" %}<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5M16 8a3 3 0 1 1 0-5M19 20c0-2-1-4-3-5"/>
      {% elif kpi.icon == "graduation" %}<path d="M2 9l10-5 10 5-10 5L2 9zM6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>
      {% elif kpi.icon == "check" %}<path d="M20 6L9 17l-5-5"/>
      {% elif kpi.icon == "user-minus" %}<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5M16 11h5"/>
      {% elif kpi.icon == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      {% elif kpi.icon == "flag" %}<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>
      {% elif kpi.icon == "wrench" %}<path d="M14 6a4 4 0 0 0-6 5l-5 5a2 2 0 1 0 3 3l5-5a4 4 0 0 0 5-6l-3 3-3-1 1-3z"/>
      {% elif kpi.icon == "box" %}<path d="M3 7l9-4 9 4v10l-9 4-9-4V7zM3 7l9 4 9-4M12 11v10"/>
      {% elif kpi.icon == "clipboard" %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/>
      {% elif kpi.icon == "file" %}<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6zM14 3v6h6"/>
      {% elif kpi.icon == "alert" %}<path d="M12 3l10 17H2L12 3zM12 10v4M12 17h.01"/>
      {% else %}<circle cx="12" cy="12" r="9"/>{% endif %}
    </svg>
  </div>
  <div class="wb-kpi-body">
    <span class="wb-kpi-label">{{ kpi.label }}</span>
    <span class="wb-kpi-value">{{ value }}{% if kpi.suffix %}{{ kpi.suffix }}{% endif %}</span>
  </div>
</article>
