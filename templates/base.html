<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ brand.name }}{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <style>
        :root {
            --wb-primary: {{ brand.primary_color }};
            --wb-accent: {{ brand.accent_color }};
            --wb-background: {{ brand.background_color }};
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/material_soft_gold.css' %}">
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
